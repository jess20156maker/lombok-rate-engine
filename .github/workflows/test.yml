# On every change: the pricing engine and calendar tests must pass and both the
# collector and the website must type-check, before Vercel's build goes live.
name: Tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
