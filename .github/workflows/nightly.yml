# Nightly market collection. Runs at 01:00 Lombok time (17:00 UTC).
# Needs the repository secret DATABASE_URL (Supabase Session pooler URI).
name: Nightly collection

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      force_booking:
        description: "Re-collect today's Booking.com dates even if already done"
        type: boolean
        default: false

concurrency:
  group: collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-env
      # The runner starts empty: pull listings, tiles and yesterday's calendars from Supabase.
      - run: npm run hydrate
      - run: npm run daily
      # Booking.com needs a real browser. Runs after Airbnb so a Booking.com
      # problem never costs the Airbnb data.
      - name: Install headless Chromium
        if: success() || failure()
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Booking.com collection
        if: success() || failure()
        run: npm run booking
        env:
          BOOKING_FORCE: ${{ inputs.force_booking || false }}
