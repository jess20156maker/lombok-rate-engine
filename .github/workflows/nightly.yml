# Nightly market collection, 01:00 Lombok time (17:00 UTC).
# Needs the repository secret DATABASE_URL (Supabase Session pooler URI).
#
# Jobs run in parallel and each writes straight to Supabase:
#   collect   Airbnb calendars, booking changes, watchlist prices
#   prices    Airbnb prices for every date in the next 6 months, split 6 ways
#   booking   Booking.com for the same dates, split 3 ways
#   finish    retire stale places, match cross-listed places, pack old price days
#   announce  comment the day's new villas on the pinned "New villas" issue (emails the owner)
name: Nightly collection

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      force_booking:
        description: "Re-collect today's Booking.com dates even if already done"
        type: boolean
        default: false

concurrency:
  group: collection
  cancel-in-progress: false

permissions:
  contents: read
  issues: write    # the daily new-villas message

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check-env
      # The runner starts empty: pull listings, tiles and yesterday's calendars from Supabase.
      - run: npm run hydrate
      # Prices are handled by the parallel jobs below.
      - run: npm run daily -- --skip-prices
      # Competitor websites (src/web/sites.ts): a few page loads.
      - run: npm run websites
        continue-on-error: true

  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prices -- --shard ${{ matrix.shard }}/6

  booking:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Booking.com needs a real browser.
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: npm run booking -- --shard ${{ matrix.shard }}/3
        env:
          BOOKING_FORCE: ${{ inputs.force_booking || false }}

  finish:
    needs: [collect, prices, booking]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run finish

  announce:
    needs: finish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run new-villas
      - name: Post to the New villas issue
        run: |
          [ -s new-villas.md ] || exit 0
          gh label create new-villas --color 0e8a16 --description "Daily new villas" --force >/dev/null
          n=$(gh issue list --label new-villas --state open --limit 1 --json number -q '.[0].number')
          if [ -z "$n" ]; then
            url=$(gh issue create --title "New villas in south Lombok" --label new-villas \
              --body "Every morning after the nightly collection, the Airbnb and Booking.com places seen for the first time are posted here as a comment.")
            n=${url##*/}
            gh issue pin "$n" || true
          fi
          gh issue comment "$n" --body-file new-villas.md
